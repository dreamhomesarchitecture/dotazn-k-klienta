<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vstupní dotazník k projektu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas: #ffffff;
    --paper: #ffffff;
    --ink: #14130f;
    --soft: #8b887f;
    --line: #e7e4dc;
    --sage: #A4AC7F;
    --sage-tint: rgba(164,172,127,0.16);
    --tan: #BA9470;
    --tan-tint: rgba(186,148,112,0.16);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: var(--canvas);
    color: var(--ink);
    font-family:'DM Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding: 148px 18px 60px;
  }
  #tab-content{ margin-top: 14px; }
  .app{ width:100%; max-width: 720px; }

  /* Top bar */
  .topbar{
    position:fixed; top:0; left:0; right:0;
    width:100%;
    background: var(--paper);
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px clamp(18px, 4vw, 56px) 18px;
    gap:14px;
    z-index: 50;
  }
  .brand{ display:flex; align-items:center; cursor:pointer; }
  .brand:hover{ opacity:.75; }
  .brand img{ height:75px; width:auto; display:block; }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .nav-links{ display:flex; gap:26px; }
  .nav-links button{
    background:none; border:none; cursor:pointer;
    font-family:'DM Sans', sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color: var(--soft);
    padding:6px 0; border-bottom:2px solid transparent;
  }
  .nav-links button.active{ color: var(--ink); }
  .nav-links button[data-tab="form"].active{ border-color: var(--sage); }
  .nav-links button[data-tab="admin"].active{ border-color: var(--tan); }

  .admin-subtabs{ display:flex; gap:26px; margin-bottom:26px; border-bottom:1.5px solid var(--line); }
  .admin-subtabs button{
    background:none; border:none; cursor:pointer;
    font-family:'DM Sans', sans-serif; font-size:12.5px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color: var(--soft);
    padding:0 0 12px; border-bottom:2px solid transparent; margin-bottom:-1.5px;
  }
  .admin-subtabs button.active{ color: var(--ink); border-color: var(--tan); }

  .resp-table-wrap{ overflow-x:auto; }
  .resp-table{ width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  .resp-table th{ text-align:left; padding:6px 6px; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--soft); border-bottom:1.5px solid var(--line); }
  .resp-table td{ padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; overflow-wrap:break-word; }
  .resp-table td.price{ color: var(--tan); font-weight:700; white-space:nowrap; }
  .resp-table td.nowrap, .resp-table th.nowrap{ white-space:nowrap; }
  .resp-table .col-actions{ width:34px; }
  .resp-pdf-btn, .resp-delete-btn{ width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--soft); font-size:14px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
  .resp-delete-btn{ font-size:16px; }
  .resp-pdf-btn:hover{ border-color:var(--tan); color:var(--tan); }
  .resp-delete-btn:hover{ border-color:#b3382c; color:#b3382c; background:rgba(179,56,44,0.08); }
  .progress-ring{ position:relative; width:38px; height:38px; flex:none; }
  .progress-ring svg circle{ transition: stroke-dashoffset .3s ease; }
  .progress-ring-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700; color:var(--ink); }

  h1,h2,h3{ margin:0; }

  /* Sheet */
  .sheet{
    background: transparent;
    border-radius: 0;
    box-shadow: none;
    padding: 10px 4px 24px;
    min-height: 340px;
    display:flex; flex-direction:column;
    position:relative;
    overflow:visible;
  }
  .side-label{
    position:absolute; left:-30px; top:50%; transform:translateY(-50%) rotate(-90deg);
    font-size:10.5px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color: var(--line);
    white-space:nowrap;
  }

  .eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color: var(--soft); margin-bottom:18px; }
  .eyebrow b{ color: var(--ink); }

  .q-title{ font-weight:800; font-size:30px; line-height:1.2; letter-spacing:-0.01em; margin-bottom:8px; }
  .q-hint{ color: var(--soft); font-size:14px; line-height:1.55; margin-bottom:26px; }
  .q-body{ flex:1; margin-top:22px; }

  textarea, input[type=text], select{
    width:100%;
    border: 1.5px solid var(--line);
    background:#fff;
    padding: 13px 15px;
    font-family:'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    border-radius: 10px;
  }
  textarea{ min-height:104px; resize:vertical; line-height:1.5; }
  textarea:focus, input[type=text]:focus, select:focus{ outline:none; border-color: var(--ink); }

  .choices{ display:flex; flex-direction:column; gap:9px; }
  .choice-btn{
    text-align:left; display:flex; align-items:center; gap:11px;
    border: 1.5px solid var(--line); background:#fff;
    padding: 13px 16px; font-size:15px; color: var(--ink);
    cursor:pointer; border-radius:12px;
    transition: border-color .12s, background .12s;
  }
  .choice-btn .dot{ width:14px; height:14px; border-radius:50%; border:1.5px solid var(--soft); flex:none; position:relative; }
  .choice-btn.selected{ border-color: var(--sage); background: var(--sage-tint); }
  .choice-btn.selected .dot{ border-color: var(--sage); }
  .choice-btn.selected .dot::after{ content:""; position:absolute; inset:3px; border-radius:50%; background: var(--sage); }
  .choice-btn:hover{ border-color: var(--ink); }

  .image-pair{ display:flex; gap:14px; }
  .image-opt{ width:50%; cursor:pointer; }
  .image-opt .frame{ border-radius:14px; overflow:hidden; border: 1.5px solid var(--line); position:relative; }
  .image-opt img{ width:100%; height:200px; object-fit:cover; display:block; filter:grayscale(0.35); transition: filter .2s, transform .3s; }
  .image-opt.selected .frame{ border-color: var(--tan); }
  .image-opt.selected img{ filter:grayscale(0); }
  .image-opt.dimmed img{ filter:grayscale(0.75) brightness(0.85); }
  .image-opt:not(.selected):hover img{ transform:scale(1.04); }
  .image-opt .cap-eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color: var(--soft); margin: 12px 0 3px; }
  .image-opt .cap-title{ font-size:15px; font-weight:700; }
  .image-opt.selected .cap-title{ color: var(--tan); }

  .rooms-table{ display:flex; flex-direction:column; gap:8px; }
  .room-head{ display:grid; grid-template-columns: 1fr 90px 100px; gap:12px; padding:0 14px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin-bottom:2px; }
  .room-row{ display:grid; grid-template-columns: 1fr 90px 100px; align-items:center; gap:12px; border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; transition:border-color .12s, background .12s; }
  .room-row.checked{ border-color: var(--sage); background: var(--sage-tint); }
  .room-check{ display:flex; align-items:center; gap:10px; font-size:14.5px; cursor:pointer; }
  .room-check input[type=checkbox]{ width:16px; height:16px; accent-color: var(--sage); cursor:pointer; flex:none; }
  .room-rec{ font-size:13px; color: var(--soft); white-space:nowrap; }
  .room-size{ width:100%; text-align:center; padding:8px 6px; }
  .room-size:disabled{ background: var(--canvas); color: var(--line); }
  .room-row-sub{ margin-left:26px; }
  .room-row-locked{ opacity:.5; }
  .room-check input[type=checkbox]:disabled{ cursor:not-allowed; }
  .custom-row{ border-color: var(--tan); background: var(--tan-tint); }
  .room-custom-label{ padding:8px 10px; font-size:14px; }
  .room-size-wrap{ display:flex; align-items:center; gap:6px; }
  .room-size-wrap .room-size{ flex:1; }
  .rooms-total{ margin-top:16px; padding-top:14px; border-top:1.5px solid var(--line); }
  .rooms-total-row{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:14px; color: var(--soft); padding:3px 0; }
  .rooms-total-row b{ color: var(--ink); font-size:15.5px; }
  .rooms-total-row.grand{ font-weight:700; }
  .rooms-total-row.grand span{ color: var(--ink); }
  .rooms-total-row.grand b{ color: var(--tan); font-size:19px; }

  .status-list{ display:flex; flex-direction:column; gap:10px; }
  .status-row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; }
  .status-row-label{ font-size:14.5px; flex:1 1 200px; }
  .status-options{ display:flex; gap:6px; flex:0 0 auto; }
  .status-btn{ border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 12px; font-size:12.5px; font-family:'DM Sans', sans-serif; color: var(--soft); cursor:pointer; white-space:nowrap; }
  .status-btn:hover{ border-color: var(--ink); }
  .status-btn.selected{ border-color: var(--sage); background: var(--sage-tint); color: var(--ink); font-weight:700; }
  @media (max-width:520px){
    .status-row{ flex-direction:column; align-items:stretch; }
    .status-options{ justify-content:space-between; }
    .status-btn{ flex:1; text-align:center; padding:8px 6px; }
  }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:30px; padding-top:20px; border-top:1px solid var(--line); }
  .circle-btn{
    width:46px; height:46px; border-radius:50%; border:1.5px solid var(--sage);
    background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color: var(--sage);
    transition: opacity .15s, transform .1s;
  }
  .circle-btn:disabled{ opacity:.28; cursor:not-allowed; }
  .circle-btn.filled{ background: var(--sage); border-color: var(--sage); color:#fff; }
  .circle-btn:active:not(:disabled){ transform: scale(0.94); }
  .nav-spacer{ width:46px; }

  .btn{ font-family:'DM Sans', sans-serif; font-weight:700; font-size:14px; border-radius:999px; padding:13px 26px; cursor:pointer; border:1.5px solid var(--ink); }
  .btn-primary{ background: var(--ink); color:#fff; }
  .btn-primary:disabled{ opacity:.32; cursor:not-allowed; }
  .btn-outline{ background:none; color:var(--ink); }
  .btn-sage{ background: var(--sage); border-color: var(--sage); color:#fff; }
  .btn-tan{ background: var(--tan); border-color: var(--tan); color:#fff; }
  .btn-small{ padding:8px 15px; font-size:12.5px; border-radius:999px; }

  .intro, .outro{ text-align:center; padding: 30px 4px 10px; }
  .intro .hero{ font-weight:800; font-size: clamp(52px, 9vw, 78px); line-height:0.95; letter-spacing:-0.03em; margin: 0 0 22px; transition: opacity .35s ease; }
  .hero-fade{ opacity: 0; }
  .intro p, .outro p{ color: var(--soft); font-size:15.5px; line-height:1.65; max-width:440px; margin:0 auto 28px; }
  .outro .hero{ font-weight:800; font-size: clamp(38px, 6vw, 52px); letter-spacing:-0.02em; margin-bottom:16px; }
  .client-info{ display:flex; flex-direction:column; gap:10px; max-width:360px; margin:0 auto 28px; text-align:left; }

  /* Admin */
  .admin-block{ margin-bottom: 30px; }
  .admin-block-title{ font-weight:700; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); margin-bottom:14px; padding-bottom:10px; border-bottom:1.5px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .admin-block-title span:first-child{ color: var(--ink); }

  .gate{ text-align:center; padding: 20px 10px; }
  .gate p{ color:var(--soft); font-size:14px; margin: 8px 0 20px; }
  .gate input{ max-width:220px; margin: 0 auto 16px; text-align:center; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(20,19,15,0.55); display:flex; align-items:center; justify-content:center; padding:24px; z-index:200; }
  .modal-card{ background:#fff; border-radius:16px; max-width:440px; width:100%; padding:28px 26px 24px; text-align:center; }
  .modal-card p{ color:var(--soft); font-size:14.5px; line-height:1.6; margin:0 0 22px; }

  .q-card{ border:1.5px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; }
  .q-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .q-card-head .idx{ font-size:11px; color:var(--soft); font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .q-card-actions{ display:flex; gap:6px; }
  .icon-btn{ background:none; border:1.5px solid var(--line); border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:13px; color:var(--soft); line-height:1; }
  .icon-btn:hover{ border-color:var(--ink); color:var(--ink); }
  .field-row{ margin-bottom:11px; }
  .field-label{ font-size:11px; font-weight:700; color:var(--soft); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px; }
  .opt-row{ display:flex; gap:8px; margin-bottom:7px; }
  .opt-row input{ flex:1; }
  .img-fields{ display:flex; gap:12px; }
  .img-fields > div{ flex:1; }
  .img-preview{ width:100%; height:110px; object-fit:cover; border-radius:10px; border:1.5px solid var(--line); display:block; margin-bottom:8px; }
  input[type=file]{ width:100%; font-size:12.5px; color:var(--soft); }

  .empty-state{ text-align:center; color:var(--soft); padding:30px 10px; font-size:14px; border:1.5px dashed var(--line); border-radius:14px; }
  .save-msg{ font-size:12.5px; color: var(--sage); font-weight:700; margin-left:8px; }

  @media (max-width:520px){
    .sheet{ padding:10px 2px 20px; }
    .side-label{ display:none; }
    .image-pair{ flex-direction:column; }
    .image-opt{ width:100%; }
    .room-head{ display:none; }
    .room-row{ grid-template-columns: 1fr; gap:8px; }
    .custom-row .room-rec{ display:none; }
    .topbar{ padding: 16px 18px 14px; }
    .brand img{ height:59px; }
    .nav-links{ gap:14px; }
    .nav-links button{ font-size:10.5px; }
  }
  /* Vlastní kurzor: bílá šipka s tenkým černým obrysem přes celou stránku.
     Nad klikatelnými prvky se používá standardní systémová ručička. */
  body{
    cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2224%22%20height%3D%2224%22%3E%3Cpath%20d%3D%22M4%2C2%20L4%2C19%20L8.3%2C15.2%20L11.3%2C21.5%20L14.2%2C20.1%20L11.2%2C13.8%20L17.5%2C13.8%20Z%22%20fill%3D%22white%22%20stroke%3D%22black%22%20stroke-width%3D%221.4%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E") 4 2, auto;
  }
  button, a, select, label,
  input[type="checkbox"], input[type="file"], input[type="file"]::-webkit-file-upload-button,
  .choice-btn, .image-opt, .circle-btn, .icon-btn, .brand, .btn,
  .nav-links button, [role="button"]{
    cursor: pointer !important;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

  try{ return new Date(iso).toLocaleString('cs-CZ', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }

}

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function escapeAttr(str){ return escapeHtml(str); }

/* ---------- client form logic ---------- */
function questionAnswered(q){
  const v = state.answers[q.id];
  if(q.type === "text") return typeof v === "string" && v.trim().length > 0;
  if(q.type === "choice") return !!v;
  if(q.type === "image-choice") return v === "A" || v === "B";
  if(q.type === "rooms"){
    const ans = v || {};
    const predefined = ans.predefined || {};
    const custom = ans.custom || [];
    const hasPredefined = Object.values(predefined).some(r => r && r.selected && String(r.size||"").trim().length > 0);
    const hasCustom = custom.some(c => c.label && String(c.label).trim().length > 0 && String(c.size||"").trim().length > 0);
    return hasPredefined || hasCustom;
  }
  if(q.type === "status-list"){
    const ans = v || {};
    return q.items.every(item => !!ans[item.id]);
  }
  return false;
}

function computeRoomTotals(q, ans){
  ans = ans || {};
  const predefined = ans.predefined || {};
  const custom = ans.custom || [];
  let net = 0;
  q.rooms.forEach(r => {
    const ra = predefined[r.id];
    if(ra && ra.selected){ const n = parseFloat(String(ra.size).replace(',','.')); if(!isNaN(n)) net += n; }
  });
  custom.forEach(c => { const n = parseFloat(String(c.size).replace(',','.')); if(!isNaN(n)) net += n; });
  const withHallways = net * 1.12;
  const gross = withHallways * 1.20;
  return { net, withHallways, gross };
}

function answerValueForStorage(q){
  if(q.type === "image-choice"){
    return state.answers[q.id] === "A" ? q.imageA.label : state.answers[q.id] === "B" ? q.imageB.label : "";
  }
  if(q.type === "rooms"){
    const ans = state.answers[q.id] || {};
    const predefined = ans.predefined || {};
    const custom = ans.custom || [];
    const parts = q.rooms
      .filter(r => predefined[r.id] && predefined[r.id].selected)
      .map(r => `${r.label}: ${ (predefined[r.id].size || "—") } m² (doporučeno ${fmtRoomRange(r)})`);
    custom.filter(c => c.label && c.size).forEach(c => {
      parts.push(`${c.label} (vlastní): ${c.size} m²`);
    });
    const totals = computeRoomTotals(q, ans);
    parts.push(`Celková plocha místností: ${round1(totals.net)} m²`);
    parts.push(`Součet včetně chodeb (cca +12 %): ${round1(totals.withHallways)} m²`);
    parts.push(`Hrubá podlažní plocha (cca +20 % včetně ploch pod zdí): ${round1(totals.gross)} m²`);
    return parts.join("; ");
  }
  if(q.type === "status-list"){
    const ans = state.answers[q.id] || {};
    return q.items.map(item => {
      const opt = (item.statusOptions || q.statusOptions).find(o => o.key === ans[item.id]);
      return `${item.label}: ${opt ? opt.label : "—"}`;
    }).join("; ");
  }
  return state.answers[q.id] || "";
}
function round1(n){ return Math.round(n * 10) / 10; }
function fmtM2(n){ return round1(n).toLocaleString('cs-CZ') + " m²"; }
function fmtCzk(n){ return Math.round(n).toLocaleString('cs-CZ') + " Kč"; }
function computeHousePrice(grossM2){ return grossM2 * 4 * 17000; }
function getGrossM2(it){
  if(typeof it.roomsGrossM2 === "number" && it.roomsGrossM2 !== null) return it.roomsGrossM2;
  const roomsAnswer = it.answers.find(a => a.type === "rooms");
  return roomsAnswer && roomsAnswer.detail && roomsAnswer.detail.totals ? round1(roomsAnswer.detail.totals.gross) : null;
}
function fmtRoomRange(r){
  const min = r.recommendedMin, max = r.recommendedMax;
  if(min === "" || min === undefined || min === null) return "";
  if(max === "" || max === undefined || max === null || String(max) === String(min)) return `${min} m²`;
  return `${min}–${max} m²`;
}

function roomsDetailForStorage(q, ans){
  ans = ans || {};
  const predefined = ans.predefined || {};
  const custom = ans.custom || [];
  const rooms = q.rooms.map(r => {
    const ra = predefined[r.id] || {};
    return { label: r.label, recommendedMin: r.recommendedMin, recommendedMax: r.recommendedMax, parentId: r.parentId || null, selected: !!ra.selected, size: ra.size || "" };
  });
  const customRooms = custom.filter(c => c.label && String(c.label).trim()).map(c => ({ label: c.label, size: c.size || "" }));
  const totals = computeRoomTotals(q, ans);
  return { rooms, custom: customRooms, totals };
}

function statusListDetailForStorage(q, ans){
  ans = ans || {};
  return q.items.map(item => {
    const opt = (item.statusOptions || q.statusOptions).find(o => o.key === ans[item.id]);
    return { label: item.label, statusLabel: opt ? opt.label : null };
  });
}

async function submitResponses(){
  setState({ submitting: true });
  const answers = state.questions.map(q => {
    const base = { id: q.id, title: q.title, short: q.short || q.title, type: q.type, value: answerValueForStorage(q) };
    if(q.type === "rooms") base.detail = roomsDetailForStorage(q, state.answers[q.id]);
    if(q.type === "status-list") base.detail = statusListDetailForStorage(q, state.answers[q.id]);
    return base;
  });
  const roomsQuestion = state.questions.find(q => q.type === "rooms");
  const roomsTotals = roomsQuestion ? computeRoomTotals(roomsQuestion, state.answers[roomsQuestion.id]) : null;
  const roomsTotalM2 = roomsTotals ? round1(roomsTotals.net) : null;
  const roomsGrossM2 = roomsTotals ? round1(roomsTotals.gross) : null;
  const record = { submittedAt: new Date().toISOString(), clientName: state.clientName.trim(), clientBuildType: state.clientBuildType.trim(), clientLocation: state.clientLocation.trim(), roomsTotalM2, roomsGrossM2, answers };
  try{
    const r = await fetch('/api/responses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(record)
    });
    if(!r.ok) throw new Error('submit failed');
  }catch(e){ console.error("Uložení se nezdařilo:", e); }
  sendEmailNotification(record); // doběhne na pozadí, neblokuje odeslání
  setState({ formView: "outro", submitting: false, lastSubmittedRecord: record });
}

async function sendEmailNotification(record){
  if(!WEB3FORMS_ACCESS_KEY) return; // klíč zatím nenastaven — e-mail se neposílá
  const messageBody = record.answers.map(a => `${a.title}\n${a.value || "—"}`).join("\n\n");
  try{
    await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        access_key: WEB3FORMS_ACCESS_KEY,
        to: NOTIFY_EMAIL,
        subject: "Nová odpověď z dotazníku — " + APP_TITLE,

}

/* ---------- PDF export ---------- */
function loadScriptOnce(src, globalCheck){
  return new Promise((resolve, reject) => {
    if(globalCheck()) return resolve();
    const existing = document.querySelector(`script[src="${src}"]`);
    if(existing){ existing.addEventListener('load', () => resolve()); existing.addEventListener('error', () => reject(new Error("Nepodařilo se načíst " + src))); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Nepodařilo se načíst " + src));
    document.head.appendChild(s);
  });
}

          Všechna práva vyhrazena. Výpočet je pouze orientační.
        </div>
        <img src="${BRAND_LOGO}" alt="${escapeAttr(BRAND_MARK)}" style="height:56px; width:auto; display:block; margin:12px auto 0;">
      </div>
    `;
    document.body.appendChild(container);

    const breakEls = [...container.querySelectorAll('.pdf-row, .pdf-row table tr')];
    const rowBottomsCss = breakEls.map(el => el.offsetTop + el.offsetHeight).sort((a,b) => a - b);

    const canvas = await window.html2canvas(container, { scale, backgroundColor: "#ffffff" });
    document.body.removeChild(container);
    const rowBottomsPx = rowBottomsCss.map(y => y * scale);

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const margin = 32;
    const usableWidth = doc.internal.pageSize.getWidth() - margin * 2;
    const usableHeight = doc.internal.pageSize.getHeight() - margin * 2;
    const pxPerPt = canvas.width / usableWidth;
    const pageHeightPx = usableHeight * pxPerPt;

    let renderedPx = 0;
    let firstPage = true;
    while(renderedPx < canvas.height){
      const naiveEnd = renderedPx + pageHeightPx;
      let sliceEnd = Math.min(naiveEnd, canvas.height);
      if(sliceEnd < canvas.height){
        const safeBreak = rowBottomsPx.filter(y => y > renderedPx && y <= naiveEnd).pop();
        if(safeBreak) sliceEnd = safeBreak;
      }
      const sliceHeightPx = sliceEnd - renderedPx;
      const pageCanvas = document.createElement("canvas");
      pageCanvas.width = canvas.width;
      pageCanvas.height = sliceHeightPx;
      pageCanvas.getContext("2d").drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
      if(!firstPage) doc.addPage();
      doc.addImage(pageCanvas.toDataURL("image/jpeg", 0.92), "JPEG", margin, margin, usableWidth, sliceHeightPx / pxPerPt);
      renderedPx += sliceHeightPx;
      firstPage = false;
    }

    const safeName = (it.clientName || "dotaznik").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "");
    doc.save(`dotaznik-${safeName || "klient"}.pdf`);
  }catch(e){
    alert("Nepodařilo se vygenerovat PDF. Zkontrolujte připojení k internetu a zkuste to znovu.");
    console.error(e);
  }finally{
    if(triggerBtn){ triggerBtn.disabled = false; triggerBtn.textContent = originalLabel; }
  }
}

function progressRingTemplate(){
  const total = state.questions.length;
  const completed = state.questions.filter(q => questionAnswered(q)).length;
  const percent = total ? Math.round((completed / total) * 100) : 0;
  const r = 16;
  const circumference = 2 * Math.PI * r;
  const dashoffset = circumference * (1 - percent / 100);
  return `
    <div class="progress-ring" title="${completed} z ${total} otázek vyplněno">
      <svg width="38" height="38" viewBox="0 0 38 38">
        <circle cx="19" cy="19" r="${r}" fill="none" stroke="var(--line)" stroke-width="3"></circle>
        <circle cx="19" cy="19" r="${r}" fill="none" stroke="var(--sage)" stroke-width="3"
          stroke-dasharray="${circumference}" stroke-dashoffset="${dashoffset}"
          stroke-linecap="round" transform="rotate(-90 19 19)"></circle>
      </svg>
      <span class="progress-ring-label">${percent}%</span>
    </div>`;
}

/* ---------- render ---------- */
function render(){
  if(!ADMIN_ACCESS && state.tab === "admin") state.tab = "form";
  const app = document.getElementById('app');
  const showCounter = state.tab === "form" && state.formView === "question";
  const total = state.questions.length;
  app.innerHTML = `
    <div class="topbar">
      <div class="brand" id="home-btn" role="button" tabindex="0" aria-label="Zpět na úvod"><img src="${BRAND_LOGO}" alt="${escapeAttr(BRAND_MARK)}"></div>
      <div class="topbar-right">
        ${ADMIN_ACCESS ? `
        <div class="nav-links">
          <button data-tab="form" class="${state.tab==='form'?'active':''}">Dotazník</button>
          <button data-tab="admin" class="${state.tab==='admin'?'active':''}">Správa</button>
        </div>` : ``}
        ${showCounter ? progressRingTemplate() : ``}
      </div>
    </div>
    <div id="tab-content"></div>
    ${state.showDisclaimer ? disclaimerModalTemplate() : ""}
  `;
  document.querySelectorAll('.nav-links button').forEach(b => b.onclick = () => setState({ tab: b.getAttribute('data-tab') }));
  const homeBtn = document.getElementById('home-btn');
  if(homeBtn){
    homeBtn.onclick = goHome;
    homeBtn.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goHome(); } });
  }
  const disclaimerBtn = document.getElementById('disclaimer-ok-btn');
  if(disclaimerBtn) disclaimerBtn.onclick = () => setState({ showDisclaimer: false, formView: "question" });

  const content = document.getElementById('tab-content');
  if(!state.questionsLoaded){ content.innerHTML = `<div class="sheet"><div class="empty-state">Načítám…</div></div>`; return; }
  if(state.tab === "form"){ content.innerHTML = formTemplate(); bindForm(); }
  else{
    content.innerHTML = adminTemplate(); bindAdmin();
    if(state.adminUnlocked && state.responses === null) loadResponses();
  }
}

    const val = state.answers[q.id] || "";
    body = `<textarea id="q-input" placeholder="${escapeAttr(q.placeholder || '')}">${escapeHtml(val)}</textarea>`;
  } else if(q.type === "choice"){
    body = `<div class="choices">` + q.options.map(opt => `
      <button class="choice-btn ${state.answers[q.id]===opt?'selected':''}" data-opt="${escapeAttr(opt)}">
        <span class="dot"></span>${escapeHtml(opt)}
      </button>`).join("") + `</div>`;
  } else if(q.type === "image-choice"){
    const sel = state.answers[q.id];
    body = `
      <div class="image-pair">
        <div class="image-opt ${sel==='A'?'selected':''} ${sel==='B'?'dimmed':''}" data-choice="A">
          <div class="frame"><img src="${escapeAttr(q.imageA.url)}" alt="${escapeAttr(q.imageA.label)}"></div>
          <div class="cap-eyebrow">Varianta A</div>
          <div class="cap-title">${escapeHtml(q.imageA.label)}</div>
        </div>
        <div class="image-opt ${sel==='B'?'selected':''} ${sel==='A'?'dimmed':''}" data-choice="B">
          <div class="frame"><img src="${escapeAttr(q.imageB.url)}" alt="${escapeAttr(q.imageB.label)}"></div>
          <div class="cap-eyebrow">Varianta B</div>
          <div class="cap-title">${escapeHtml(q.imageB.label)}</div>
        </div>
      </div>`;
  } else if(q.type === "rooms"){
    const ans = state.answers[q.id] || {};
    const predefined = ans.predefined || {};
    const custom = ans.custom || [];
    const totals = computeRoomTotals(q, ans);

    body = `
      <div class="rooms-table">
        <div class="room-head"><span>Místnost</span><span>Doporučení</span><span>Vaše velikost</span></div>
        ${q.rooms.map(r => {
          const ra = predefined[r.id] || {};
          const checked = !!ra.selected;
          const parentChecked = !r.parentId || !!(predefined[r.parentId] && predefined[r.parentId].selected);
          const rowClasses = ["room-row", checked?"checked":"", r.parentId?"room-row-sub":"", !parentChecked?"room-row-locked":""].filter(Boolean).join(" ");
          return `
            <div class="${rowClasses}">
              <label class="room-check">
                <input type="checkbox" data-room-check="${r.id}" ${checked?'checked':''} ${parentChecked?'':'disabled'}>
                <span>${escapeHtml(r.label)}</span>
              </label>
              <span class="room-rec">${fmtRoomRange(r)}</span>
              <input type="text" inputmode="decimal" class="room-size" data-room-size="${r.id}" placeholder="m²" value="${escapeAttr(ra.size||'')}" ${checked?'':'disabled'}>
            </div>`;
        }).join("")}
        ${custom.map((c, ci) => `
          <div class="room-row custom-row checked">
            <input type="text" class="room-custom-label" data-custom-label="${ci}" placeholder="Vlastní místnost" value="${escapeAttr(c.label||'')}">
            <span class="room-rec">—</span>
            <span class="room-size-wrap">
              <input type="text" inputmode="decimal" class="room-size" data-custom-size="${ci}" placeholder="m²" value="${escapeAttr(c.size||'')}">
              <button class="icon-btn" data-remove-custom="${ci}" title="Odebrat místnost">×</button>
            </span>
          </div>`).join("")}
      </div>
      <button class="btn btn-outline btn-small" id="add-custom-room" style="margin-top:12px;">+ Přidat vlastní místnost</button>
      <div class="rooms-total">
        <div class="rooms-total-row"><span>Celková plocha místností</span><b data-total="net">${fmtM2(totals.net)}</b></div>
        <div class="rooms-total-row"><span>Součet včetně chodeb (cca +12 %)</span><b data-total="hallways">${fmtM2(totals.withHallways)}</b></div>
        <div class="rooms-total-row grand"><span>Hrubá podlažní plocha (cca +20 % včetně ploch pod zdí)</span><b data-total="gross">${fmtM2(totals.gross)}</b></div>
      </div>`;
  } else if(q.type === "status-list"){
    const ans = state.answers[q.id] || {};
    body = `
      <div class="status-list">
        ${q.items.map(item => `
          <div class="status-row">
            <span class="status-row-label">${escapeHtml(item.label)}</span>
            <div class="status-options">
              ${(item.statusOptions || q.statusOptions).map(opt => `
                <button type="button" class="status-btn ${ans[item.id]===opt.key?'selected':''}" data-status-item="${item.id}" data-status-key="${opt.key}">${escapeHtml(opt.label)}</button>
              `).join("")}
            </div>
          </div>`).join("")}
      </div>`;
  }

  return `
    <div class="sheet">
      <div class="eyebrow">Otázka <b>${state.step+1}</b> z ${total}</div>
      <div class="q-title">${escapeHtml(q.title)}</div>
      ${q.hint ? `<div class="q-hint">${escapeHtml(q.hint)}</div>` : ""}
      <div class="q-body">${body}</div>
      <div class="nav-row">
        <button class="circle-btn" id="back-btn" aria-label="${state.step===0 ? 'Zpět na úvod' : 'Zpět'}">←</button>
        ${isLast
          ? `<button class="btn btn-primary" id="next-btn" ${answered?'':'disabled'}>${state.submitting ? 'Odesílám…' : 'Odeslat odpovědi'}</button>`
          : `<button class="circle-btn filled" id="next-btn" aria-label="Další" ${answered?'':'disabled'}>→</button>`}
      </div>
    </div>

}

function refreshRoomsUI(q){
  const nextBtn = document.getElementById('next-btn');
  if(nextBtn) nextBtn.disabled = !questionAnswered(q);
  const totals = computeRoomTotals(q, state.answers[q.id]);
  const netEl = document.querySelector('[data-total="net"]');
  const hallEl = document.querySelector('[data-total="hallways"]');
  const grossEl = document.querySelector('[data-total="gross"]');
  if(netEl) netEl.textContent = fmtM2(totals.net);
  if(hallEl) hallEl.textContent = fmtM2(totals.withHallways);
  if(grossEl) grossEl.textContent = fmtM2(totals.gross);
}

let heroTimer = null;
function startHeroBlink(){
  clearInterval(heroTimer);
  const el = document.querySelector('.hero');
  if(!el || HERO_WORDS.length < 2) return;
  let idx = 0;
  heroTimer = setInterval(() => {
    idx = (idx + 1) % HERO_WORDS.length;
    el.classList.add('hero-fade');
    setTimeout(() => {
      el.textContent = HERO_WORDS[idx];
      el.classList.remove('hero-fade');
    }, 350);
  }, 2200);
}

function goHome(){
  clearInterval(heroTimer);
  setState({ tab: "form", formView: "intro" });
}

function bindForm(){
  if(state.formView === "intro"){
    const startBtn = document.getElementById('start-btn');
    startBtn.onclick = () => { clearInterval(heroTimer); setState({ showDisclaimer: true }); };
    const nameInput = document.getElementById('client-name-input');
    const buildTypeInput = document.getElementById('client-buildtype-input');
    const locationInput = document.getElementById('client-location-input');
    nameInput.addEventListener('input', () => { state.clientName = nameInput.value; startBtn.disabled = !clientInfoReady(); });
    buildTypeInput.addEventListener('input', () => { state.clientBuildType = buildTypeInput.value; startBtn.disabled = !clientInfoReady(); });
    locationInput.addEventListener('input', () => { state.clientLocation = locationInput.value; startBtn.disabled = !clientInfoReady(); });
    startHeroBlink();
    return;
  }
  if(state.formView === "outro"){
    clearInterval(heroTimer);
    const pdfBtn = document.getElementById('outro-pdf-btn');
    if(pdfBtn) pdfBtn.onclick = () => downloadResponsePdf(state.lastSubmittedRecord, pdfBtn);
    return;
  }

  const q = state.questions[state.step];
  const backBtn = document.getElementById('back-btn');
  const nextBtn = document.getElementById('next-btn');
  if(backBtn) backBtn.onclick = () => {
    if(state.step === 0) goHome();
    else setState({ step: Math.max(0, state.step-1) });
  };

  if(q.type === "text"){
    const input = document.getElementById('q-input');
    input.addEventListener('input', () => { state.answers[q.id] = input.value; nextBtn.disabled = !questionAnswered(q); });
    input.focus();
  }
  if(q.type === "choice"){
    document.querySelectorAll('.choice-btn').forEach(btn => btn.onclick = () => { state.answers[q.id] = btn.getAttribute('data-opt'); render(); });
  }
  if(q.type === "image-choice"){
    document.querySelectorAll('.image-opt').forEach(el => el.onclick = () => { state.answers[q.id] = el.getAttribute('data-choice'); render(); });
  }
  if(q.type === "rooms"){
    state.answers[q.id] = state.answers[q.id] || { predefined: {}, custom: [] };
    const ansBucket = state.answers[q.id];
    ansBucket.predefined = ansBucket.predefined || {};
    ansBucket.custom = ansBucket.custom || [];

    document.querySelectorAll('[data-room-check]').forEach(el => {
      el.addEventListener('change', () => {
        const roomId = el.getAttribute('data-room-check');
        ansBucket.predefined[roomId] = ansBucket.predefined[roomId] || {};
        ansBucket.predefined[roomId].selected = el.checked;
        if(!el.checked){
          q.rooms.filter(r => r.parentId === roomId).forEach(child => {
            if(ansBucket.predefined[child.id]){
              ansBucket.predefined[child.id].selected = false;
              ansBucket.predefined[child.id].size = "";
            }
          });
        }
        render();
      });
    });
    document.querySelectorAll('[data-room-size]').forEach(el => {
      el.addEventListener('input', () => {
        const roomId = el.getAttribute('data-room-size');
        ansBucket.predefined[roomId] = ansBucket.predefined[roomId] || {};
        ansBucket.predefined[roomId].size = el.value;
        refreshRoomsUI(q);
      });
    });
    document.querySelectorAll('[data-custom-label]').forEach(el => {
      el.addEventListener('input', () => {
        const ci = +el.getAttribute('data-custom-label');
        ansBucket.custom[ci].label = el.value;
        refreshRoomsUI(q);
      });
    });
    document.querySelectorAll('[data-custom-size]').forEach(el => {
      el.addEventListener('input', () => {
        const ci = +el.getAttribute('data-custom-size');
        ansBucket.custom[ci].size = el.value;
        refreshRoomsUI(q);
      });
    });
    document.querySelectorAll('[data-remove-custom]').forEach(b => {
      b.onclick = () => {
        const ci = +b.getAttribute('data-remove-custom');
        ansBucket.custom.splice(ci, 1);
        render();
      };
    });
    const addCustomBtn = document.getElementById('add-custom-room');
    if(addCustomBtn) addCustomBtn.onclick = () => {
      ansBucket.custom.push({ label: "", size: "" });
      render();
    };
  }
  if(q.type === "status-list"){
    state.answers[q.id] = state.answers[q.id] || {};
    const ansBucket = state.answers[q.id];
    document.querySelectorAll('[data-status-item]').forEach(btn => {
      btn.onclick = () => {
        const itemId = btn.getAttribute('data-status-item');
        const key = btn.getAttribute('data-status-key');
        ansBucket[itemId] = key;
        render();
      };
    });
  }
  nextBtn.onclick = () => {
    if(!questionAnswered(q) || state.submitting) return;
    if(state.step === state.questions.length - 1) submitResponses();
    else setState({ step: state.step + 1 });
  };
}

        </div>
        <div>
          <label class="field-label">Obrázek B</label>
          ${q.imageB?.url ? `<img src="${escapeAttr(q.imageB.url)}" class="img-preview" alt="">` : ``}
          <input type="file" accept="image/*" data-img-upload="B" data-idx="${i}">
          <label class="field-label" style="margin-top:8px;">Obrázek B — popisek</label>
          <input type="text" data-field="imgB-label" data-idx="${i}" value="${escapeAttr(q.imageB?.label||'')}">
        </div>
      </div>`;
  } else if(q.type === "rooms"){
    typeFields = `
      <div class="field-row">
        <label class="field-label">Místnosti a doporučená velikost — od–do (m²)</label>
        ${q.rooms.map((r, ri) => `
          <div class="opt-row">
            <input type="text" placeholder="Název místnosti" data-room-label="${ri}" data-idx="${i}" value="${escapeAttr(r.label)}">
            <input type="text" placeholder="od" style="max-width:64px;flex:0 0 64px;" data-room-min="${ri}" data-idx="${i}" value="${escapeAttr(String(r.recommendedMin ?? ''))}">
            <input type="text" placeholder="do" style="max-width:64px;flex:0 0 64px;" data-room-max="${ri}" data-idx="${i}" value="${escapeAttr(String(r.recommendedMax ?? ''))}">
            <button class="icon-btn" data-remove-room="${ri}" data-idx="${i}">×</button>
          </div>`).join("")}
        <button class="btn btn-outline btn-small" data-add-room="${i}">+ Místnost</button>
      </div>`;
  } else if(q.type === "status-list"){
    typeFields = `
      <div class="field-row">
        <label class="field-label">Body seznamu</label>
        ${q.items.map((item, ii) => `
          <div class="opt-row">
            <input type="text" placeholder="Název bodu" data-status-item-label="${ii}" data-idx="${i}" value="${escapeAttr(item.label)}">
            <span style="font-size:11px;color:var(--soft);white-space:nowrap;align-self:center;">${escapeHtml((item.statusOptions || q.statusOptions).map(o=>o.label).join(" / "))}</span>
            <button class="icon-btn" data-remove-status-item="${ii}" data-idx="${i}">×</button>
          </div>`).join("")}
        <button class="btn btn-outline btn-small" data-add-status-item="${i}">+ Bod</button>
      </div>`;
  }

  return `
    <div class="q-card">
      <div class="q-card-head">
        <span class="idx">Otázka ${i+1}</span>
        <div class="q-card-actions">
          <button class="icon-btn" data-move-up="${i}" ${i===0?'disabled':''}>↑</button>
          <button class="icon-btn" data-move-down="${i}" ${i===total-1?'disabled':''}>↓</button>
          <button class="icon-btn" data-delete-q="${i}">×</button>
        </div>
      </div>
      <div class="field-row">
        <label class="field-label">Znění otázky</label>
        <input type="text" data-field="title" data-idx="${i}" value="${escapeAttr(q.title)}">
      </div>
      <div class="field-row">
        <label class="field-label">Krátký název pro PDF (volitelné)</label>
        <input type="text" data-field="short" data-idx="${i}" value="${escapeAttr(q.short||'')}">
      </div>
      <div class="field-row">
        <label class="field-label">Nápověda (volitelné)</label>
        <input type="text" data-field="hint" data-idx="${i}" value="${escapeAttr(q.hint||'')}">
      </div>
      <div class="field-row">
        <label class="field-label">Typ otázky</label>
        <select data-field="type" data-idx="${i}">
          <option value="text" ${q.type==='text'?'selected':''}>Text</option>
          <option value="choice" ${q.type==='choice'?'selected':''}>Výběr z možností</option>
          <option value="image-choice" ${q.type==='image-choice'?'selected':''}>Výběr ze dvou obrázků</option>
          <option value="rooms" ${q.type==='rooms'?'selected':''}>Místnosti domu (výběr + m²)</option>
          <option value="status-list" ${q.type==='status-list'?'selected':''}>Seznam bodů (3 stavy)</option>
        </select>
      </div>
      ${typeFields}
    </div>
  `;
}

function blankQuestion(type){
  const base = { id: "q_" + uid(), title: "Nová otázka", short: "", hint: "" };
  if(type === "choice") return { ...base, type:"choice", options:["Možnost 1","Možnost 2"] };
  if(type === "image-choice") return { ...base, type:"image-choice", imageA:{url:"",label:"Varianta A"}, imageB:{url:"",label:"Varianta B"} };
  if(type === "rooms") return { ...base, type:"rooms", rooms:[
    { id: uid(), label: "Obývací pokoj", recommendedMin: 25, recommendedMax: 25 },
    { id: uid(), label: "Kuchyň", recommendedMin: 14, recommendedMax: 14 },
    { id: uid(), label: "Ložnice", recommendedMin: 16, recommendedMax: 16 }
  ]};
  if(type === "status-list") return { ...base, type:"status-list", statusOptions: ANO_NE_STATUS_OPTIONS, items:[
    { id: uid(), label: "Nový bod 1" },
    { id: uid(), label: "Nový bod 2" }
  ]};
  return { ...base, type:"text", placeholder:"" };
}

function bindAdmin(){
  if(!state.adminUnlocked){
    const input = document.getElementById('pass-input');
    const submit = document.getElementById('pass-submit');
    const tryUnlock = () => {
      if(input.value === ADMIN_PASSCODE) setState({ adminUnlocked:true, passError:false, passInput:"" });
      else setState({ passError:true, passInput: input.value });
    };
    submit.onclick = tryUnlock;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
    input.focus();
    return;
  }

  document.querySelectorAll('[data-admin-section]').forEach(b => b.onclick = () => setState({ adminSection: b.getAttribute('data-admin-section') }));

  const addQBtn = document.getElementById('add-q-btn');
  if(addQBtn) addQBtn.onclick = () => { state.questions.push(blankQuestion("text")); render(); };
  const saveQBtn = document.getElementById('save-q-btn');
  if(saveQBtn) saveQBtn.onclick = () => saveQuestions();

  document.querySelectorAll('[data-move-up]').forEach(b => b.onclick = () => {
    const i = +b.getAttribute('data-move-up');
    if(i>0){ [state.questions[i-1], state.questions[i]] = [state.questions[i], state.questions[i-1]]; render(); }
  });
  document.querySelectorAll('[data-move-down]').forEach(b => b.onclick = () => {
    const i = +b.getAttribute('data-move-down');
    if(i<state.questions.length-1){ [state.questions[i+1], state.questions[i]] = [state.questions[i], state.questions[i+1]]; render(); }
  });
  document.querySelectorAll('[data-delete-q]').forEach(b => b.onclick = () => {
    const i = +b.getAttribute('data-delete-q');
    if(confirm("Opravdu smazat tuto otázku?")){ state.questions.splice(i,1); render(); }
  });

  document.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener(el.tagName==='SELECT' ? 'change' : 'input', () => {
      const i = +el.getAttribute('data-idx');
      const field = el.getAttribute('data-field');
      const q = state.questions[i];
      if(field === "type"){
        const newType = el.value;
        const preserved = blankQuestion(newType);
        state.questions[i] = { ...preserved, id: q.id, title: q.title, short: q.short, hint: q.hint };
        render();
        return;
      }
      if(field === "title") q.title = el.value;
      else if(field === "short") q.short = el.value;
      else if(field === "hint") q.hint = el.value;
      else if(field === "placeholder") q.placeholder = el.value;
      else if(field === "imgA-url"){ q.imageA = q.imageA || {}; q.imageA.url = el.value; }
      else if(field === "imgA-label"){ q.imageA = q.imageA || {}; q.imageA.label = el.value; }
      else if(field === "imgB-url"){ q.imageB = q.imageB || {}; q.imageB.url = el.value; }
      else if(field === "imgB-label"){ q.imageB = q.imageB || {}; q.imageB.label = el.value; }
    });
  });

  document.querySelectorAll('[data-img-upload]').forEach(el => {
    el.addEventListener('change', () => {
      const file = el.files && el.files[0];
      if(!file) return;
      const i = +el.getAttribute('data-idx');
      const side = el.getAttribute('data-img-upload'); // "A" or "B"
      const reader = new FileReader();
      reader.onload = () => {
        const q = state.questions[i];
        if(side === "A"){ q.imageA = q.imageA || {}; q.imageA.url = reader.result; }
        else{ q.imageB = q.imageB || {}; q.imageB.url = reader.result; }
        render();
      };
      reader.readAsDataURL(file);
    });
  });

  document.querySelectorAll('[data-opt-idx]').forEach(el => {
    el.addEventListener('input', () => {
      const i = +el.getAttribute('data-idx');
      const oi = +el.getAttribute('data-opt-idx');
      state.questions[i].options[oi] = el.value;
    });
  });
  document.querySelectorAll('[data-add-opt]').forEach(b => b.onclick = () => {
    const i = +b.getAttribute('data-add-opt');
    state.questions[i].options.push("Nová možnost");
    render();
  });
  document.querySelectorAll('[data-remove-opt]').forEach(b => b.onclick = () => {
    const i = +b.getAttribute('data-idx');
    const oi = +b.getAttribute('data-remove-opt');
    state.questions[i].options.splice(oi,1);
    render();
  });

  document.querySelectorAll('[data-room-label]').forEach(el => {
    el.addEventListener('input', () => {
      const i = +el.getAttribute('data-idx');
      const ri = +el.getAttribute('data-room-label');
      state.questions[i].rooms[ri].label = el.value;
    });
  });
  document.querySelectorAll('[data-room-min]').forEach(el => {
    el.addEventListener('input', () => {
      const i = +el.getAttribute('data-idx');
      const ri = +el.getAttribute('data-room-min');
      state.questions[i].rooms[ri].recommendedMin = el.value;
    });
  });
  document.querySelectorAll('[data-room-max]').forEach(el => {
    el.addEventListener('input', () => {
      const i = +el.getAttribute('data-idx');
      const ri = +el.getAttribute('data-room-max');
      state.questions[i].rooms[ri].recommendedMax = el.value;
    });
  });
  document.querySelectorAll('[data-add-room]').forEach(b => b.onclick = () => {
    const i = +b.getAttribute('data-add-room');
    state.questions[i].rooms.push({ id: uid(), label: "Nová místnost", recommendedMin: 10, recommendedMax: 10 });
    render();
  });
  document.querySelectorAll('[data-remove-room]').forEach(b => b.onclick = () => {
    const i = +b.getAttribute('data-idx');
    const ri = +b.getAttribute('data-remove-room');
    state.questions[i].rooms.splice(ri,1);
    render();
  });

  document.querySelectorAll('[data-status-item-label]').forEach(el => {
    el.addEventListener('input', () => {
      const i = +el.getAttribute('data-idx');
      const ii = +el.getAttribute('data-status-item-label');
      state.questions[i].items[ii].label = el.value;
    });
  });
  document.querySelectorAll('[data-add-status-item]').forEach(b => b.onclick = () => {
    const i = +b.getAttribute('data-add-status-item');
    state.questions[i].items.push({ id: uid(), label: "Nový bod" });
    render();
  });
  document.querySelectorAll('[data-remove-status-item]').forEach(b => b.onclick = () => {
    const i = +b.getAttribute('data-idx');
    const ii = +b.getAttribute('data-remove-status-item');
    state.questions[i].items.splice(ii,1);
    render();
  });

  document.querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => {
    const ri = +b.getAttribute('data-pdf');
    downloadResponsePdf(state.responses[ri], b);
  });

  document.querySelectorAll('[data-delete-resp]').forEach(b => b.onclick = () => {
    const ri = +b.getAttribute('data-delete-resp');
    deleteResponse(ri, b);
  });
}

loadQuestions();
render();
</script>
</body>
</html>
